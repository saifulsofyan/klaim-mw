<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">

 <link rel="manifest" href="manifest.json">

<style>
:root{--b:#0B5ED7;--t:#14206B;--m:#5B6478;--ln:#E1E4EE}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;color:var(--t);background:#fff}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
header{background:var(--b);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;min-height:72px;position:sticky;top:0;z-index:5}
.lg{width:44px;height:44px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:14px;font-weight:800}.tt span{font-size:12px}
.chip{background:rgba(255,255,255,.18);border-radius:10px;padding:6px 10px;text-align:right;font-size:10px}.chip b{display:block;font-size:14px}
.av{width:34px;height:34px;border-radius:50%;background:#9B3DF0;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ib{background:none;border:0;color:inherit;padding:4px;display:flex}
main{flex:1;padding:0 12px 88px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:64px;background:#fff;border-top:1px solid var(--ln);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--m);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button.on{color:var(--b)}
.mp{display:flex;align-items:center;gap:6px;width:max-content;margin:10px auto;border:1px solid #D5D9E6;border-radius:12px;padding:4px 12px}
.mp select{border:0;background:none;font:inherit;font-weight:700;font-size:14px;color:var(--t);padding:8px 0}
.bn{border-radius:14px;background:var(--b);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bn h2{margin:0;font-size:19px;font-weight:800}.bn p{margin:4px 0 0;font-size:12px;line-height:1.4}
.cd{border:1px solid var(--ln);border-radius:14px;padding:10px;margin-top:12px;box-shadow:0 1px 3px rgba(20,32,107,.08)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hd h3{flex:1;margin:0;font-size:16px;font-weight:800}
.ico{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.c1{--bg:#EFE7FF;--fg:#6D28D9}.c2{--bg:#E2EEFF;--fg:#1D4ED8}.c3{--bg:#DFF6E6;--fg:#15803D}.c4{--bg:#FFE8D2;--fg:#B45309}.c5{--bg:#FDE4E4;--fg:#B91C1C}.c6{--bg:#FFF1D6;--fg:#B45309}.c7{--bg:#DDF2FA;--fg:#0E7490}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tl{border:0;border-radius:12px;background:var(--bg);padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;color:var(--t)}
.tl b{font-size:10.5px;color:var(--fg);margin-top:2px;white-space:nowrap}.tl .n{font-size:36px;font-weight:800;line-height:1.1}.tl .u{font-size:11px}
.ch{font-style:normal;font-size:11px;color:var(--fg);padding:4px 0;width:92%;border-radius:8px;background:rgba(0,0,0,.05);margin-top:4px}
.g5 .tl{padding:10px 2px;font-size:11px}.g5 .tl b{white-space:normal;text-align:center}.sel{outline:2px solid var(--fg)}
.dm{background:var(--bg);color:var(--fg);border-radius:12px;padding:8px 0;text-align:center}.dm b{font-size:13px}.dm .n{font-size:34px;font-weight:800}.dm small{color:var(--t);font-size:13px}
.tot{background:#F1F3F8;border-radius:10px;padding:6px 12px;text-align:center;font-size:11px}.tot b{display:block;font-size:16px}
.mc{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:12px;background:var(--bg);padding:12px;margin-top:12px;color:var(--t);text-align:left}
.mc div:nth-child(2){flex:1}.mc b{display:block;font-size:18px;color:var(--fg)}.mc span{font-size:13px;color:var(--m)}
.f{display:block;margin-bottom:12px}.l{display:block;font-size:12px;font-weight:700}.rq{color:#D00}
.in{display:block;width:100%;height:44px;margin-top:6px;border:1px solid #C9CEDD;border-radius:10px;padding:0 12px;background:#fff;font:inherit;font-size:14px;color:var(--t)}
textarea.in{height:90px;padding:10px;resize:vertical}.in[readonly]{background:#F1F3F8}.f small{color:var(--m)}
fieldset{border:0;padding:0;margin:0;min-width:0}
.row{display:flex;gap:10px}
.btn{flex:1;min-height:48px;border:0;border-radius:12px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}.p{background:var(--b);color:#fff}.s{background:#E9ECF2;color:var(--t)}
.up{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #B7C4E6;border-radius:10px;padding:14px;margin-top:6px;color:var(--b);font-size:13px;font-weight:700;cursor:pointer}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ph div{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;background:#EEE}.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;line-height:1}
.pa{background:#F1F3F8;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-top:6px}.pa b{font-size:28px}
.info{background:#E8F1FD;border-radius:12px;padding:12px;font-size:12.5px;line-height:1.6;color:var(--m);margin-top:10px}
.tb{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th{background:#E2EEFF;padding:10px 8px}td{padding:10px 8px;text-align:center;border-bottom:1px solid #EEF0F6}tr:nth-child(even) td{background:#F4F8FE}td a{color:var(--b)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:9;max-width:90%}
@media print{header,nav,.np{display:none!important}main{padding:0}.cd{box-shadow:none}}
.md{display:flex;align-items:center;gap:6px;border:0;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;padding:5px 8px 5px 10px;font-size:11px;font-weight:700}
.md i{position:relative;width:34px;height:20px;border-radius:10px;background:#22C55E;transition:.2s;flex:none}
.md i:after{content:"";position:absolute;top:2px;left:16px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.md.off i{background:#94A3B8}.md.off i:after{left:2px}
</style>

</head>
<body>
<div id="app">
<header></header>
<main id="v"></main>
<nav></nav>
</div>
<script>
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const OPT={status:['Dalam Proses','Selesai'],tamu:['Ada Tamu','Tidak Ada Tamu'],mobil:['Stiker','Reguler','CNG'],jenis:['TSR','TRR','TBB','TSB','LC','TBT'],est:['1 hari','2 hari','1/2 hari','1/7 hari','2/7 hari'],plan:['2:1','3:1','4:1','6:1'],tindakan:['Stop Operasi','Operasional Kembali'],kat:['R','SR','B','SB','KR','LC','Subkon'],point:['0.5|½','1','1.5','2','2.5','3','5']};
const FM={
Klaim:{t:'Input Klaim',s:'Security - Klaim Kendaraan',i:'shield',c:'#6D28D9',f:[['TglKejadian','Tanggal Kejadian','date','',1],['JenisMobil','Jenis Mobil','sel','mobil',1],['NIP','NIP Pengemudi','text','',1],['Nama','Nama Pengemudi','text','',1],['NoMobil','No Mobil','text','',1],['Jenis','Jenis Kerusakan','sel','jenis',1],['Detail','Detail Kerusakan','area','',1],['WA','Pergantian WA','text'],['Foto','Foto Kerusakan','foto','',1],['Petugas','NIP & Nama Petugas','sel','petugas',1],['Lokasi','Lokasi Kejadian','text','',1],['LawanTabrak','Lawan Tabrak','text']]},
Bengkel:{t:'Input Bengkel',s:'Bengkel - Klaim Kendaraan',i:'wrench',c:'#1D4ED8',f:[['Status','Status Pengerjaan','sel','status',1],['Biaya','Estimasi Biaya (Rp)','num','',1],['TglSelesai','Tanggal Selesai Perbaikan','date','',1],['FotoSelesai','Foto Selesai Perbaikan','foto','',1],['Rincian','Capture Rincian Klaim (Data DPF)','foto','',1],['EstPerbaikan','Estimasi Perbaikan','sel','est',1],['Petugas','NIP & Nama Petugas','sel','petugasBengkel',1]]},
PU:{t:'Input PU',s:'PU - Klaim Kendaraan',i:'clip',c:'#15803D',f:[['Kategori','Kategori','sel','kat',1],['Point','Point','sel','point',1],['pa','Total Point Aktif','calc'],['Dedaan','Dedaan (Rp.)','num','',1],['Petugas','NIP & Nama Petugas','sel','petugasPU',1]]},
Operasi:{t:'Input Operasi',s:'Operasi - Klaim Kendaraan',i:'clip',c:'#B45309',f:[['Situasi','Situasi Kejadian','area','',1],['Waktu','Waktu Kejadian (jam)','time','',1],['Tamu','Tamu','sel','tamu',1],['JenisMobil','Jenis Mobil','sel','mobil',1],['Planning','Planning','sel','plan',1],['HariKerja','Hari Kerja','num','',1],['Tindakan','Tindakan kepada Pengemudi','sel','tindakan',1],['Petugas','NIP Petugas Operasi','sel','petugasOps',1]]}};
const SF=[['pool','Nama Pool','text'],['kepala','Kepala Bengkel','text'],['petugas','Petugas Security (NIP - Nama, satu per baris)','area'],['petugasOps','Petugas Operasi (NIP - Nama, satu per baris)','area'],['petugasBengkel','Petugas Bengkel (NIP - Nama, satu per baris)','area'],['petugasPU','Petugas PU (NIP - Nama, satu per baris)','area']];
const NM={Klaim:'Klaim',Bengkel:'Bengkel',PU:'PU',Operasi:'Operasi',Frek:'Frekuensi Pengemudi'};
const IC={menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',file:'<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6"/>',plus:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',gear:'<circle cx="12" cy="12" r="7" stroke-width="4" stroke-dasharray="3.2 2.2"/><circle cx="12" cy="12" r="3"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 5-5"/>',wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h6"/>',cal:'<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/>',chevr:'<path d="M9 6l6 6-6 6"/>',users:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 14c3 0 6 1.5 6 5"/>',car:'<path d="M5 16v-4l2-5h10l2 5v4zM5 16v3h3v-3M16 16v3h3v-3M7 12h10"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/>',pencil:'<path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/>',save:'<path d="M5 3h11l3 3v15H5zM8 3v6h7V3M8 21v-7h8v7"/>',upload:'<path d="M7 18a4 4 0 0 1-1-7.9A6 6 0 0 1 17.7 9 4.5 4.5 0 0 1 17 18zM12 16v-6M9 12l3-3 3 3"/>'};

const $=s=>document.querySelector(s),V=$('#v');
const ic=(n,s=24,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TK='',U=null;
const raw=(f,...a)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[f](...a));
const run=(f,...a)=>raw('api',TK,f,a).catch(e=>{if(/SESI_HABIS/.test(e.message)){bye();throw new Error('Sesi berakhir, silakan login lagi')}throw e});
const RF={security:'Klaim',bengkel:'Bengkel',pu:'PU',operasi:'Operasi'},can=t=>!!U&&(U.peran=='admin'||RF[U.peran]==t),fgo=t=>can(t)?go('form',t):toast('Akun Anda tidak punya akses Input '+t);
const opt=(l,s)=>l.map(x=>{const[v,t]=String(x).split('|');return`<option value="${esc(v)}"${v==s?' selected':''}>${esc(t||v)}</option>`}).join('');
const yrs=()=>{const y=new Date().getFullYear();return[y-3,y-2,y-1,y,y+1]};
const now=()=>{const d=new Date();return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()+' '+d.toTimeString().slice(0,5)};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)};
const d0=new Date();
let S={pool:'Pool Margasatwa',kepala:'-'},M=d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0'),P='dash',X='',PH={},LT='Klaim',LR=[],LH=null,LP='',LM='';
const fm=m=>BLN[+m.slice(5)-1]+' '+m.slice(0,4),bl=()=>BLN[+M.slice(5)-1];

// ---- bulan (bisa diedit) ----
const msel=()=>`<div class="mp np">${ic('cal',20,'#0B5ED7')}<select id="mm" aria-label="Bulan" onchange="setM()">${opt(BLN.map((b,i)=>(i+1)+'|'+b),+M.slice(5))}</select><select id="my" aria-label="Tahun" onchange="setM()">${opt(yrs(),M.slice(0,4))}</select></div>`;
function setM(){M=$('#my').value+'-'+String($('#mm').value).padStart(2,'0');render()}

// ---- saklar Online / Offline (hanya di aplikasi HP/PWA) ----
const modeSw=()=>window.MODE?`<button class="md ${MODE.off()?'off':''}" onclick="togMode()" aria-label="Mode online atau offline"><span>${MODE.off()?'Offline':'Online'}</span><i></i></button>`:'<div class="chip">Kepala Bengkel<b>'+esc(S.kepala)+'</b></div>';
function togMode(){MODE.set(!MODE.off());head();toast(MODE.off()?'Mode OFFLINE: ringkasan dari HP, input langsung ke Google Sheet':'Mode ONLINE: semua data langsung dari server');if(!MODE.off()&&P=='dash')render()}
// ---- header, menu bawah, router ----
function head(x){$('header').innerHTML=x
 ?`<button class="ib" onclick="go('${x.back||'dash'}')" aria-label="Kembali">${ic('back',28)}</button><div class="lg">${ic(x.i,28,x.c)}</div><div class="tt"><b style="font-size:20px">${x.t}</b><span>${x.s}</span></div>`
 :`<button class="ib" onclick="go('dash')" aria-label="Menu">${ic('menu')}</button><div class="lg">${ic('car',28,'#0B5ED7')}</div><div class="tt"><b>Monitoring KLAIM MW</b><span>${esc(S.pool)}</span></div>${modeSw()}<div class="av">${esc(((U&&U.nama)||'?')[0].toUpperCase())}</div>`}
function nv(){const on={dash:0,frek:0,lap:1,input:2,form:2,set:3}[P];$('nav').innerHTML=[['dash','Dashboard','home'],['lap','Laporan','file'],['input','Input Data','plus'],['set','Pengaturan','gear']].map(([p,t,i],n)=>`<button class="${n==on?'on':''}" onclick="go('${p}')">${ic(i,26)}${t}</button>`).join('')}
function go(p,x){P=p;X=x;window.scrollTo(0,0);nv();render()}
async function render(){V.innerHTML='<p style="text-align:center;color:#5B6478">Memuat…</p>';try{await({dash:vDash,input:vInput,form:vForm,lap:vLap,frek:vFrek,set:vSet}[P])()}catch(e){toast(e.message||'Terjadi kesalahan')}}

// ---- dashboard ----
async function vDash(){
 head();const d=await run('dashboard',M);
 const tl=(c,i,t,n,s,to)=>`<button class="tl ${c}" onclick="fgo('${to}')">${ic(i,28,'var(--fg)')}<b>${t}</b><span class="n">${n}<small style="font-size:10px;font-weight:700;margin-left:3px;color:var(--fg)">${to=='Klaim'?100:(d.klaim?Math.min(100,Math.round(n/d.klaim*100)):0)}%</small></span><span class="u">Unit</span><i class="ch">${s}</i></button>`;
 V.innerHTML=msel()+`<div class="bn"><div><h2>MONITORING KLAIM MW</h2><p>Rekap klaim<br>bulan ${fm(M)}.</p></div>${ic('car',64,'#fff')}</div>
<div class="cd"><div class="hd"><div class="ico c1">${ic('file',22,'var(--fg)')}</div><h3>Claim ${fm(M)}</h3></div><div class="g4">${tl('c1','shield','Input Claim',d.klaim,'Security','Klaim')+tl('c2','wrench','Input Bengkel',d.bengkel,'Bengkel','Bengkel')+tl('c3','clip','Input PU',d.pu,'PU','PU')+tl('c4','gear','Input Operasi',d.operasi,'Operasi','Operasi')}</div></div>
<div class="cd"><div class="hd"><div class="ico c5">${ic('wrench',22,'var(--fg)')}</div><h3>Jenis Kerusakan</h3><div class="tot">Total<b>${d.klaim} Unit</b></div></div><div class="g3">${OPT.jenis.map((j,i)=>`<div class="dm c${[5,2,6,3,1,7][i]}"><b>${j}</b><div><span class="n">${d.jenis[j]}</span> <small>Unit</small></div></div>`).join('')}</div></div>
<div class="cd hd" style="margin-bottom:0"><div class="ico c2">${ic('users',22,'var(--fg)')}</div><div style="flex:1"><b>Frekuensi Pengemudi</b><br><small>Lihat detail frekuensi pengemudi</small></div><button class="btn" style="flex:none;padding:0 12px;background:#0F7A3D;color:#fff;font-size:12px" onclick="go('frek')">Tampilkan Data ›</button></div>`}

// ---- menu Input Data ----
async function vInput(){
 head();const mc=(c,i,t,s,to)=>`<button class="mc ${c}" onclick="fgo('${to}')"><div class="ico" style="width:64px;height:64px;background:rgba(255,255,255,.65)">${ic(i,36,'var(--fg)')}</div><div><b>${t}</b><span>Input data klaim kendaraan (${s})</span></div>${ic('chevr',22,'var(--fg)')}</button>`;
 V.innerHTML=msel()+`<div class="bn"><div><h2>INPUT DATA</h2><p>Pilih jenis input data yang ingin diisi untuk bulan ${fm(M)}.</p></div>${ic('clip',56,'#fff')}</div>`+[['c1','shield','Input Klaim','Security','Klaim'],['c2','wrench','Input Bengkel','Bengkel','Bengkel'],['c3','clip','Input PU','PU','PU'],['c4','gear','Input Ops','Operasi','Operasi']].filter(x=>can(x[4])).map(x=>mc(...x)).join('')||'<div class="cd">Akun Anda tidak memiliki akses input data. Hubungi admin.</div>'}

// ---- form input (Klaim, Bengkel, PU, Operasi) ----
function fld([k,l,t,o,r]){
 const p=l.toLowerCase(),q=r?'<b class="rq"> *</b>':'',h=`<label class="f"><span class="l">${l}${q}</span>`;
 if(t=='calc')return`<div class="f"><span class="l">${l}</span><div class="pa"><span>Total point pengemudi<br><small>dalam 6 bulan terakhir</small></span><span><b id="pv">0.0</b> Point</span></div><div class="info">Total point dihitung otomatis berdasarkan jumlah klaim yang sudah tercatat untuk NIP pengemudi ini dalam 6 bulan terakhir.</div></div>`;
 if(t=='foto')return`<div class="f"><span class="l">${l}${q}</span><label class="up">${ic('upload',24,'#0B5ED7')}Klik untuk upload foto (JPG, PNG)<input type="file" accept="image/*" multiple hidden onchange="addPh('${k}',this)"></label><div class="ph" id="ph_${k}"></div></div>`;
 if(t=='area')return h+`<textarea class="in" name="${k}" maxlength="500" placeholder="Jelaskan ${p}"></textarea></label>`;
 if(t=='sel')return h+`<select class="in" name="${k}"><option value="">Pilih ${p}</option>${opt(OPT[o]||(S[o]||'').split('\n').filter(Boolean))}</select></label>`;
 return h+`<input class="in" name="${k}" type="${t=='num'?'number':t}"${t=='num'?' inputmode="numeric" min="0"':''} placeholder="Masukkan ${p}"></label>`}
async function vForm(){
 const F=FM[X];head({t:F.t,s:F.s,i:F.i,c:F.c,back:'input'});PH={};
 if(!can(X)){V.innerHTML='<div class="cd">Akun Anda tidak punya akses untuk form ini.</div>';return}
 const rg=await run('regs',X);
 if(X!='Klaim'&&!rg.length){V.innerHTML='<div class="cd">Tidak ada nomor registrasi yang menunggu input ini. Semua klaim sudah diinput, atau Input Klaim belum diisi.</div>';return}
 const reg=X=='Klaim'?await run('nextReg'):rg[0].v;
 V.innerHTML=`<form class="cd" id="dataForm" onsubmit="return false">
 <label class="f"><span class="l">Tanggal</span><input class="in" readonly value="${now()}"></label>

function qrSvg(text){

 const dv=[];for(let i=0;i<ec-1;i++)dv.push(0);dv.push(1);

 for(let i=0,k=0;i<nb;i++){
  const d=data.slice(k,k+shortLen-ec+(i<nShort?0:1));k+=d.length;
  const rem=dv.map(()=>0);

  if(i<nShort)d.push(0);blocks.push(d.concat(rem));
