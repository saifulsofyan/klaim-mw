<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a4fd8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bengkel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bengkel &amp; Armada Monitoring</title>
<style>
:root{--blue:#1a4fd8;--blue2:#0b3bb8;--ink:#0f1b4d;--muted:#6b7694;--bg:#f2f5fc;--card:#fff;--line:#e3e9f7;
--red:#d1203a;--redbg:#fde8ea;--grn:#0d8f5a;--grnbg:#e0f7ec;--org:#e8590c;--orgbg:#fff1e0;--vio:#5b21f0;--violbg:#ece8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:left}
input,select,textarea{font:inherit;color:inherit}
.ic{width:22px;height:22px;flex:none;vertical-align:middle}
.ic.xl{width:46px;height:46px}.ic.sm{width:16px;height:16px}

/* layout */
.side{position:fixed;left:0;top:0;bottom:0;width:84%;max-width:320px;background:#fff;z-index:40;transform:translateX(-100%);transition:transform .25s;overflow-y:auto;padding:14px 14px 30px;box-shadow:2px 0 24px rgba(15,27,77,.15)}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(10,20,60,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.scrim.show{opacity:1;pointer-events:auto}
.content{min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.menu-btn{width:40px;height:40px;display:grid;place-items:center;color:var(--blue2)}
.menu-btn .ic{width:28px;height:28px}
.logo{width:42px;height:42px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center;color:var(--blue);flex:none;background:#fff}
.brand{font-weight:800;color:var(--blue2);letter-spacing:.2px;line-height:1.1}
.brandsub{color:var(--blue);font-size:14px}
.avatar{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.side-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.side-head .x{margin-left:auto;color:var(--blue2);width:36px;height:36px;display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;color:var(--blue2);font-weight:600;margin-bottom:6px}
.nav .go{margin-left:auto;color:var(--blue)}
.nav small{display:block;font-weight:500;color:var(--blue);font-size:13px}
.nav.hl{background:#e3edff}
.nav.on{background:#cfe0ff;outline:2px solid #b7cffb}
.nav.sub{padding:9px 12px 9px 46px;font-weight:500}
.nav.sub .ic{width:34px;height:34px;background:#e3edff;border-radius:50%;padding:7px}
.sep{height:1px;background:var(--line);margin:8px 0}
.rot{transition:transform .2s}.rot.open{transform:rotate(180deg)}
.pad{padding:14px;max-width:980px;margin:0 auto}
.banner{width:100%;height:33.6vw;max-height:240px;overflow:hidden;background:#dbe9ff}
.banner img{width:100%;height:100%;object-fit:cover;object-position:50% 72%;display:block}

/* dashboard cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:flex;flex-direction:column;width:100%;background:var(--ct);border-radius:18px;padding:0 0 12px;text-align:center;box-shadow:0 4px 16px rgba(26,79,216,.08);border-bottom:5px solid var(--c);position:relative;overflow:hidden}
.card .cimg{display:block;width:100%;height:auto;flex:none;aspect-ratio:440/246;object-fit:cover;margin:0 0 6px}
.card .ct{font-weight:800;font-size:17px;margin:0 12px 8px;flex:1;display:flex;align-items:center;justify-content:center;min-height:24px}
.card .stat{background:#fff;margin:0 12px;border-radius:12px;padding:8px 10px;box-shadow:0 1px 4px rgba(26,79,216,.08);display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:800}
.card .stat div{display:flex;gap:8px;align-items:center;color:var(--c);white-space:nowrap}
.card .stat b{font-size:20px}
.card .stat div:first-child b{font-size:clamp(15px,4.6vw,20px)}
.card .stat span{font-weight:500;color:var(--ink)}
.pkwrap{max-width:640px;margin:0 auto}
.pkform,.pkcard{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(26,79,216,.08)}
.pkform label,.pkform .lab{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-top:12px}
.pkform label:first-child{margin-top:0}
.pkform input{display:block;width:100%;border:1.5px solid #cfd9f2;border-radius:12px;padding:12px;margin-top:4px;background:#fff;color:var(--ink);font-size:16px}
.pkform input:focus{outline:none;border-color:var(--blue)}
.segs{display:flex;gap:8px;margin-top:6px}
.seg{flex:1;border:1.5px solid #cdd7ef;border-radius:12px;padding:13px 6px;font-weight:700;color:var(--blue2);background:#fff;text-align:center}
.seg.s-teknik{background:#5b21f0;border-color:#5b21f0;color:#fff}.seg.s-ki{background:#10b981;border-color:#10b981;color:#fff}
.pkhint{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.4}.pkok{margin:12px 2px 0;color:#0b8a5f;font-weight:700;display:flex;align-items:center;gap:6px}
.pktime{margin-top:4px;font-weight:600;color:var(--muted)}.pkrun b{font-variant-numeric:tabular-nums;font-size:20px;color:#1a4fd8;margin-left:4px}.pkend b{color:var(--ink)}.pkl{display:block}
.pkdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#10b981;margin-right:6px;animation:pkp 1.2s infinite}
@keyframes pkp{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pkdot{animation:none}}
.pkbtn{margin-top:10px}.btn.pkdone{background:#10b981}
.pksync{margin-top:12px;font-size:12.5px;line-height:1.4;text-align:center;color:var(--muted)}.pksync.ok{color:#0b8a5f;font-weight:600}.pksync.err{color:var(--red)}.pksync .ic{vertical-align:-2px;margin-right:3px}
.pkfin{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:#0b8a5f;font-weight:800}
#pkres{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.pkhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.pkhead b{font-size:19px}
.pill.pk-teknik{background:#ece8ff;color:#5b21f0}.pill.pk-ki{background:#dff7ee;color:#0b8a5f}
.pknone{margin-top:6px;color:var(--muted);line-height:1.45}
.jobs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:4px}
.jcard{--w:calc((100% - 12px) / 2);flex:0 0 var(--w);max-width:var(--w);display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;
  background:linear-gradient(180deg,var(--j1) 55%,var(--j2));border-radius:16px;border-bottom:5px solid var(--c);padding:0 0 14px;box-shadow:0 4px 16px rgba(26,79,216,.08);transition:transform .12s,box-shadow .12s}
.jcard:active{transform:scale(.98)}
.jcard .jimg{display:block;width:100%;height:auto;aspect-ratio:300/271;-webkit-mask-image:linear-gradient(#000 90%,transparent);mask-image:linear-gradient(#000 90%,transparent)}
.jbadge{position:relative;width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:20px;letter-spacing:.3px;display:grid;place-items:center;margin:-6px 0 8px;box-shadow:0 3px 8px rgba(15,27,77,.18)}
.jt{font-weight:800;font-size:17px;line-height:1.2;color:var(--ink);min-height:41px;display:flex;align-items:flex-start;justify-content:center;padding:0 6px}
.j-pk{--c:#714ffc;--j1:#f6f6fd;--j2:#f8f8fe}.j-ck{--c:#03bb6f;--j1:#f0fdf8;--j2:#effef8}.j-tb{--c:#fda802;--j1:#fef9ee;--j2:#fef8e9}.j-cs{--c:#2091ff;--j1:#f2fafe;--j2:#f8fcff}.j-ps{--c:#fe5256;--j1:#fef2f2;--j2:#fffbfa}
@media (min-width:600px){.jcard{--w:calc((100% - 24px) / 3)}}
@media (min-width:840px) and (max-width:899px){.jcard{--w:calc((100% - 48px) / 5)}}
@media (min-width:1180px){.jcard{--w:calc((100% - 48px) / 5)}}
.c-vio{--c:#5b21f0;--cb:#ece8ff;--ct:#f6f5fe}.c-grn{--c:#10b981;--cb:#dff7ee;--ct:#f0fcf9}.c-org{--c:#f59e0b;--cb:#fff1d6;--ct:#fef8ea}.c-blu{--c:#1e6ff0;--cb:#e1ecff;--ct:#ebf6fe}
.lapcard{display:flex;align-items:center;gap:12px;background:#fde8ea;border-radius:16px;padding:12px;margin:14px 0 10px}
.lapicon{width:52px;height:52px;border-radius:50%;background:#fff;color:#e0334f;display:grid;place-items:center;flex:none}
.lapcard b{font-size:18px}.lapcard span{display:block;color:var(--muted);font-size:13px}
.cnt{margin-left:auto;text-align:center;display:grid;grid-template-columns:auto auto auto;gap:0 6px;align-items:end}
.cnt b{font-size:34px;line-height:1}.cnt i{font-size:26px;color:#8a93b2;font-style:normal}
.cnt small{grid-row:2;font-size:12px;color:var(--muted)}
.red{color:#e0233f}.grn{color:#0d9d63}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;font-weight:700;border-radius:12px;padding:11px 16px}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid #b8cdf7}
.btn.full{width:100%}
.btn[disabled]{opacity:.6;pointer-events:none}
.searchbar{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #cfd9f2;border-radius:14px;padding:0 14px;margin:10px 0;color:#8a93b2}
.searchbar input{border:0;outline:0;background:none;width:100%;padding:13px 0;color:var(--ink)}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(26,79,216,.06);width:100%}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-size:16px}
.item .mid small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.item .mid .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq{width:54px;height:54px;border-radius:14px;background:var(--violbg);color:var(--blue2);display:grid;place-items:center;flex:none}
.no{color:#2a14e0}
.pill{display:inline-block;border-radius:10px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.st-Baru{background:var(--redbg);color:var(--red)}.st-Dikerjakan{background:var(--grnbg);color:var(--grn)}.st-Selesai{background:#e5ecfb;color:#3552b8}
.chev{color:#7e88a8}

/* service list */
.subhead{display:flex;align-items:center;gap:14px;background:#eceff5;padding:12px 16px;font-size:22px;font-weight:800}
.subhead .back{width:36px;height:36px;display:grid;place-items:center}
.subhead h2{margin:0;font-size:22px}
.svctitle{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.svctitle .count{border-radius:10px;padding:8px 12px;font-weight:700}
.svctitle b{font-size:20px}
.t-teknik .count{background:var(--violbg);color:var(--vio)}.t-teknik b{color:#3b0fa8}
.t-ki .count{background:var(--grnbg);color:var(--grn)}.t-ki b{color:#0b3a66}
.vchip{display:flex;align-items:center;gap:6px;border-radius:12px;padding:10px 10px;font-weight:800;color:#6a14e8;background:#efe9ff;flex:none;width:150px}
.vchip.kal{background:#fdeeb0;color:#5b3300}
.kmb{border-radius:12px;padding:10px 12px;font-weight:800;text-align:center;min-width:84px;flex:none}
.kmb.red{background:var(--redbg);color:var(--red)}.kmb.org{background:#fff0d6;color:#e8590c}
.stNOPR{color:#0d9d63;font-weight:700}.stOSNO{color:#ef6b00;font-weight:700}

/* tables */
.hcard{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 16px rgba(26,79,216,.08)}
.hcard .hi{width:50px;height:50px;border-radius:50%;background:#e8eaff;color:#2a2fc0;display:grid;place-items:center}
.hcard h3{margin:0;font-size:22px;font-weight:800}
.hcard .cn{background:#e6ecff;color:#2851d4;border-radius:12px;padding:7px 12px;font-weight:700;font-size:15px}
.hcard .btn{margin-left:auto}
.spin .ic{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.filters select{border:1.5px solid #cfd9f2;border-radius:12px;padding:9px 10px;background:#eaf0ff;color:var(--blue2);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chipb{flex:none;border:1.5px solid #cdd7ef;background:#fff;border-radius:12px;padding:10px 14px;font-weight:600;color:var(--blue2)}
.chipb.on{background:#5b21f0;color:#fff;border-color:#5b21f0}
.tbl{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(26,79,216,.08)}
.tr{display:grid;grid-template-columns:var(--cols);align-items:center;border-bottom:1px solid var(--line)}
.tr>div{padding:9px 10px}
.tr.th{background:#1d5bd6;color:#fff;font-weight:700;position:sticky;top:63px;z-index:5;border-radius:16px 16px 0 0}
.tr.th>div{text-align:center;padding:14px 8px}
.tr.th .sortb{display:block;width:100%;text-align:center;font-weight:700;color:#fff}
.tr:last-child{border-bottom:0}
.nchip{display:inline-flex;align-items:center;gap:8px;background:#ece9ff;color:#2a14e0;border-radius:12px;padding:8px 10px;font-weight:800}
.tpill{display:inline-block;background:#dcf7ea;color:#0a6a46;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.c{text-align:center}.kmv{display:flex;align-items:center;gap:8px;font-weight:800;white-space:nowrap}
.kmv.red{color:#e0233f}.kmv.none{color:#9aa3bf;font-weight:600}.dtp{display:block;margin-top:2px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.more{margin:12px auto;display:flex}
.empty{background:#fff;border-radius:16px;padding:22px;text-align:center;color:var(--muted);line-height:1.5}
.empty b{color:var(--ink)}
.soon{background:#fff;border-radius:18px;padding:34px 18px;text-align:center;margin-top:14px;box-shadow:0 4px 16px rgba(26,79,216,.08)}
.soon .ic{width:54px;height:54px;color:var(--blue)}
.err{background:#fff3cd;border:1px solid #f2d37b;color:#6b4e00;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:16px 0 30px}
.foot a{color:var(--blue);font-weight:700;cursor:pointer}

/* MDB */
.mdbcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.mdbc{position:relative;border-radius:18px;padding:14px;background:var(--cb);color:var(--c);width:100%;border:2px solid transparent;min-height:150px}
.mdbc.on{border-color:var(--c)}
.mdbc h4{margin:6px 0 0;font-size:24px;font-weight:800;color:#12308f}
.mdbc p{margin:2px 0 10px;color:#12308f}
.mdbc .bd{position:absolute;right:46px;top:10px;min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:var(--c)}
.mdbc .go{position:absolute;right:12px;top:48px;color:#12308f}
.mdbc .u{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:#1a2a7c}
.m1{--c:#6d3fb8;--cb:#f1e9fb}.m2{--c:#16a36a;--cb:#e4f8ee}.m3{--c:#1e6ff0;--cb:#e1ecff}
.mdbhead{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px 16px 0 0;padding:12px 14px;border-left:6px solid #7c3aed;flex-wrap:wrap}
.mdbhead h4{margin:0;font-size:20px;font-weight:800;color:#12308f}
.mdbhead small{display:block;font-weight:700;color:#12308f;font-size:12.5px}
.mdbhead select{margin-left:auto;border:1.5px solid #cfd9f2;border-radius:10px;padding:8px 10px;background:#fff;font-weight:600}
.mdbtbl{overflow-x:auto;background:#fff;border-radius:0 0 16px 16px;box-shadow:0 2px 12px rgba(26,79,216,.08);container-name:mdb;container-type:inline-size}
.mdbtbl .in{min-width:840px}
.mdbtbl .tr{grid-template-columns:44px 100px 135px 90px 1fr 105px 125px;border-bottom:1px solid #9db6e8;border-left:1px solid #9db6e8}
.mdbtbl .tr>div{border-right:1px solid #9db6e8;padding:10px 8px;font-size:14px;align-self:stretch;display:flex;align-items:center;justify-content:center;text-align:center}
.mdbtbl .tr.th{background:#cfe0fb;color:#1a4fd8;position:static}
.mdbtbl .tr.th>div{padding:10px 6px}
.mdbtbl .tr>div.l{justify-content:flex-start;text-align:left;text-transform:uppercase}
.mdbtbl .tr.done{background:#f1fbf5}
.mdbtbl b{font-weight:800}
.mdbtbl .na{color:var(--muted)}
.mdbtbl .tr>div.jm{flex-direction:column;gap:2px}
.mdbtbl .jm small{font-size:12px;color:var(--muted);font-weight:500}
.finb{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed #9db6e8;border-radius:999px;padding:6px 14px;color:#1a4fd8;font-weight:700;font-size:13px;background:#fff}
.finb.ok{border:0;background:#dff7ee;color:#0a7d4b}
.finb .ic{width:16px;height:16px}
/* tabel sempit (HP / layar kecil): tiap mobil jadi satu kartu */
@container mdb (max-width:839px){
 .mdbtbl .in{min-width:0}
 .mdbtbl .tr.th{display:none}
 .mdbtbl .tr{grid-template-columns:auto 1fr auto;gap:4px 10px;padding:10px 12px;border-left:0;border-bottom:1px solid #d5e1f7}
 .mdbtbl .tr>div{border:0;padding:0;justify-content:flex-start;text-align:left;font-size:13px}
 .mdbtbl .tr>div:nth-child(1){grid-column:1;grid-row:1;color:var(--muted);font-weight:700}
 .mdbtbl .tr>div:nth-child(2){grid-column:2;grid-row:1;font-size:16px}
 .mdbtbl .tr>div:nth-child(6){grid-column:3;grid-row:1;color:#1a4fd8;font-weight:700;flex-direction:row;align-items:baseline;gap:6px;flex-wrap:wrap;justify-content:flex-end}
 .mdbtbl .tr>div:nth-child(6)::before{content:'Est.';color:var(--muted);font-weight:500}
 .mdbtbl .tr>div:nth-child(3){grid-column:1/3;grid-row:2;font-weight:600}
 .mdbtbl .tr>div:nth-child(4){grid-column:3;grid-row:2;color:var(--muted)}
 .mdbtbl .tr>div:nth-child(5){grid-column:1/-1;grid-row:3}
 .mdbtbl .tr>div:nth-child(7){grid-column:1/-1;grid-row:4;margin-top:4px;gap:8px}
 .mdbtbl .tr>div:nth-child(7)::before{content:'Jam selesai';color:var(--muted)}
}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,60,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px 24px;max-height:92vh;overflow-y:auto}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-head b{font-size:19px}
.sheet label{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-top:10px}
.sheet input,.sheet textarea{display:block;width:100%;border:1.5px solid #cfd9f2;border-radius:12px;padding:11px 12px;margin-top:4px;background:#fff;color:var(--ink)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:10px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.stbtns{display:flex;gap:8px;margin-top:14px}
.stbtns button{flex:1;text-align:center;border:1.5px solid #cdd7ef;border-radius:12px;padding:12px 6px;font-weight:700;color:var(--blue2)}
.stbtns button.on{border-color:transparent}

.ap-dash{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(135deg,#1a4fd8,#0b3bb8);color:#fff;border-radius:18px;padding:14px;margin:0 0 14px;box-shadow:0 8px 22px rgba(26,79,216,.28)}
.ap-dash>.ic{width:30px;height:30px;flex:none}.ap-dash b{display:block;font-size:17px}.ap-dash span{display:block;font-size:13.5px;opacity:.92;margin-top:2px}.ap-dash .go{margin-left:auto;width:20px;height:20px;flex:none}
.ap-note{display:flex;gap:10px;align-items:flex-start;background:#eef3ff;border:1px solid #d6e0f7;border-radius:14px;padding:11px 12px;color:#0b3bb8;font-size:13.5px;line-height:1.4;margin:2px 0 12px}.ap-note .ic{width:20px;height:20px;flex:none;margin-top:1px}
.ap-tabs{margin-bottom:12px}.ap-tabs.t3{grid-template-columns:repeat(3,1fr)}.ap-tabs.t3 button{padding:9px 4px;font-size:13.5px}
body.is-pkl #side nav .nav:not([data-pkl]),body.is-pkl #side nav .sep,body.is-pkl #side #partSub{display:none!important}
.iz-box{display:grid;gap:12px;text-align:center;padding:6px 2px 2px}.iz-box .iz-ic{width:56px;height:56px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:#fff6e5;color:#e8890c}.iz-box .iz-ic .ic{width:30px;height:30px}

.ap-card.iz{border-left-color:#e8890c}.ap-bts.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.ap-list{display:grid;gap:12px}

.ap-card.ready{border-left-color:#0b8a5f}.ap-card.own{border-left-color:#8a93b2}.ap-card.done{border-left-color:#0b8a5f;box-shadow:0 2px 10px rgba(26,79,216,.07)}

.rs-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

.rs-chip.man{background:#fff1d6;color:#8a5a00}
.rs-none{color:var(--muted);font-size:13px;font-weight:600}

.rs-form textarea{width:100%;border:1.5px solid #cfd8ef;border-radius:12px;padding:10px 12px;font-size:15px;resize:vertical;background:#fbfcff}
.rs-h{font-size:15.5px;margin:16px 0 8px}

.rs-items li b{flex:1;font-weight:700;overflow-wrap:anywhere}.rs-items li em{font-style:normal;font-size:11.5px;font-weight:800;color:#0b6b48;background:#e4f8ee;border-radius:8px;padding:3px 8px}
.rs-dot{width:9px;height:9px;border-radius:50%;background:#1a4fd8;flex:none}
.rs-ex{display:grid;gap:8px}.rs-exi{width:100%;border:1.5px solid #cfd8ef;border-radius:12px;padding:11px 12px;font-size:15px;background:#fbfcff}
.rs-q{font-weight:800;font-size:16px;text-align:center;margin:20px 0 2px}
.rs-form .pkyn{margin-top:10px}
.rs-err{color:#c0262d;font-weight:700;font-size:13.5px;min-height:0;margin-top:8px;text-align:center}.rs-err:empty{display:none}
.rs-warn{display:flex;gap:8px;align-items:flex-start;background:#fff1e0;color:#b45309;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.4}.rs-warn .ic{width:16px;height:16px;flex:none;margin-top:2px}
